; PlatformIO Project Configuration File for ESP32-4848S040CIY1

[platformio]
default_envs = esp32-4848S040CIY1

[env]
platform = espressif32 @ 6.9.0
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Partition scheme for OTA
board_build.partitions = min_spiffs.csv

extra_scripts = pre:pre_build.py

; Die Board-Vorgabe von 128 KB laesst sich nicht entfernen — sie steckt in
; den extra_flags der Board-Datei, und build_unflags erreicht die nicht. Sie
; bleibt deshalb stehen, und der Wert unten ueberschreibt sie: Beim Compiler
; gilt die letzte Definition. Der Preis ist eine Warnung je uebersetzter
; Datei ("redefined") — nachgeprueft an der erzeugten Befehlszeile, dass
; wirklich 65536 gewinnt.

build_flags =
    -Ofast
    ; Der DMA-Puffer des Displays liegt zwingend im internen RAM
    ; (MALLOC_CAP_DMA) und ist mit der Board-Vorgabe von 128 KB der groesste
    ; Einzelposten dort. Uebrig bleiben nach WLAN und MQTT nur noch rund
    ; 48 KB — und wenn die Oberflaeche dann Ansichten aufbaut oder ein
    ; Modellbild dekodiert, sackt es unter 25 KB. Dort scheitern die Puffer
    ; von lwIP, und die Verbindung faellt ("connection lost", "HTTP -5").
    ;
    ; Der Puffer wird nicht am Stueck gebraucht: Die Uebertragung laeuft
    ; ohnehin in Bloecken (smartdisplay_dma_transfer_chunk), die Groesse
    ; bestimmt nur, wieviele Zeilen je Block gehen. 64 KB sind noch immer
    ; ein Siebtel des Bildschirms auf einmal.
    -D SMARTDISPLAY_DMA_BUFFER_SIZE=65536
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git
    lvgl/lvgl @ 9.2.2
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/kikuchan/pngle.git
    bodmer/TJpg_Decoder @ ^1.1.0
    knolleary/PubSubClient @ ^2.8

[env:esp32-4848S040CIY1]
board = esp32-4848S040CIY1
